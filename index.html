<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090518" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Neon Nights: Nightclub Tycoon</title>
    <meta name="description" content="Isometric 2.5D social nightclub-management simulation game with multi-floor vertical expansion, tiered mixology, responsive neon dance grids, and A* guest AI." />
    <meta property="og:title" content="Neon Nights: Nightclub Tycoon" />
    <meta property="og:description" content="Isometric 2.5D social nightclub-management simulation game with multi-floor vertical expansion, tiered mixology, responsive neon dance grids, and A* guest AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body style="background-color: #090518; color: #f8fafc; margin: 0;">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Automatic GitHub Pages Branch-Deploy Loader:
      // If GitHub Pages is configured to "Deploy from a branch (main / root)", browsers cannot
      // execute raw ./src/main.tsx directly. This fallback automatically injects the pre-compiled
      // production bundle from ./dist/assets/app.bundle.js & ./dist/assets/app.bundle.css!
      (function () {
        var isStaticHost =
          window.location.hostname.indexOf('github.io') !== -1 ||
          window.location.protocol === 'file:';
        function injectPrebuiltBundle() {
          if (document.getElementById('gh-pages-fallback-bundle')) return;
          var scripts = document.getElementsByTagName('script');
          for (var i = 0; i < scripts.length; i++) {
            if (scripts[i].src && scripts[i].src.indexOf('app.bundle.js') !== -1) {
              return;
            }
          }
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './dist/assets/app.bundle.css';
          document.head.appendChild(link);

          var s = document.createElement('script');
          s.id = 'gh-pages-fallback-bundle';
          s.type = 'module';
          s.src = './dist/assets/app.bundle.js';
          document.body.appendChild(s);
        }
        if (isStaticHost) {
          injectPrebuiltBundle();
        } else {
          window.addEventListener('load', function () {
            setTimeout(function () {
              var root = document.getElementById('root');
              if (root && root.childNodes.length === 0) {
                injectPrebuiltBundle();
              }
            }, 900);
          });
        }
      })();
    </script>
  </body>
</html>
